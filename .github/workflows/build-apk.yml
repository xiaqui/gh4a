name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check OAuth secrets
        env:
          OCTODROID_CLIENT_ID: ${{ secrets.OCTODROID_CLIENT_ID }}
          OCTODROID_CLIENT_SECRET: ${{ secrets.OCTODROID_CLIENT_SECRET }}
        run: |
          if [ -n "$OCTODROID_CLIENT_ID" ]; then echo "Client ID present: yes"; else echo "Client ID present: no"; fi
          if [ -n "$OCTODROID_CLIENT_SECRET" ]; then echo "Client Secret present: yes"; else echo "Client Secret present: no"; fi

      - name: Create OAuth client.properties
        run: |
          cat > client.properties <<'EOF'
          ClientId="${{ secrets.OCTODROID_CLIENT_ID }}"
          ClientSecret="${{ secrets.OCTODROID_CLIENT_SECRET }}"
          EOF

      - name: Verify OAuth client.properties
        run: |
          test -s client.properties
          grep -q '^ClientId=".' client.properties
          grep -q '^ClientSecret=".' client.properties
          echo "OAuth client.properties ready at project root"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: octodroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
